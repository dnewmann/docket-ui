name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - name: Token contrast (WCAG)
        run: npm run contrast
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and accessibility tests
        run: npm run test
      - name: Build library
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
