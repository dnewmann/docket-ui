name: Publish to npm

# Runs when a GitHub release is published (tag like v0.2.0).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance: proves the package was built from this repo

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
